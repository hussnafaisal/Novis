services:
  postgres:
    image: postgres:16-alpine
    container_name: novis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: novis
      POSTGRES_PASSWORD: novis_password
      POSTGRES_DB: novis
    ports: ["5432:5432"]
    volumes: ["novis_pgdata:/var/lib/postgresql/data"]
  adminer:
    image: adminer:4
    container_name: novis-adminer
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on: [postgres]
volumes:
  novis_pgdata:
